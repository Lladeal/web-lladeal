                    collapsed: true
                    summary: '{titulo_tarjeta}'
                fields:
                  - name: estilo_borde
                    label: Ajuste interno de bordes (no cambiar)
                    type: string
                  - name: gridClasses
                    label: Ajuste interno de posicion (no cambiar)
                    type: string
                  - name: estilo_color
                    label: Ajuste interno de color (no cambiar)
                    type: string
                  - name: icono
                    label: Nombre del icono
                    type: string
                  - name: titulo_tarjeta
                    label: Titulo de la tarjeta
                    type: string
                  - name: descripcion
                    label: Descripcion de la tarjeta
