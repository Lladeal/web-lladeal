media:
  - name: uploads
    label: Imagenes subidas
    input: public/uploads
    output: /CMS-WEB/uploads
    categories: [image]
    rename: safe

content:
  - name: site_pages
    label: Paginas del sitio
    type: group
    items:
      - name: home_page
        label: Pagina de inicio
        type: file
        path: src/content/pages/home.json
        format: json
        fields:
          - name: anuncio
            label: Barra de anuncio superior
            type: object
            fields:
              - name: titulo
                label: Texto principal
                type: string
              - name: titulo_link
                label: Texto del enlace
                type: string
              - name: link
                label: Enlace
                type: string
          - name: hero
            label: Seccion principal
            type: object
            fields:
              - name: titulo
                label: Titulo principal
                type: string
              - name: subtitulo
                label: Texto descriptivo
                type: text
              - name: Boton_1
                label: Boton principal
                type: object
                fields:
                  - name: titulo
                    label: Texto del boton
                    type: string
                  - name: link
                    label: Enlace del boton
                    type: string
              - name: boton_2
                label: Boton secundario
                type: object
                fields:
                  - name: titulo
                    label: Texto del boton
                    type: string
                  - name: link
                    label: Enlace del boton
                    type: string
          - name: imagen
            label: Imagen y video principal
            type: object
            fields:
              - name: video
                label: Enlace del video
                type: string
              - name: ImagenArchivo
                label: Imagen subida
                type: image
                options:
                  media: uploads
              - name: Imagen
                label: Enlace de imagen externa
                type: string
          - name: features
            label: Bloque de funcionalidades destacadas
            type: object
            fields:
              - name: titulo
                label: Titulo
                type: text
              - name: subtitulo
                label: Descripcion
                type: text
              - name: lista
                label: Lista de bloques
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{titulo} ({index})"
                fields:
                  - name: titulo
                    label: Titulo
                    type: string
                  - name: descripcion
                    label: Descripcion
                    type: text
                  - name: imagen
                    label: Enlace de imagen externa
                    type: string
                  - name: imagenArchivo
                    label: Imagen subida
                    type: image
                    options:
                      media: uploads
                  - name: class
                    label: Estilos del bloque
                    type: text
                  - name: posicion
                    label: Estilos de la imagen
                    type: text
                  - name: mas_caracteristicas
                    label: Lista adicional de caracteristicas
                    type: string
                    list: true
          - name: caracteristicas
            label: Seccion de tarjetas informativas
            type: object
            fields:
              - name: titulo
                label: Titulo
                type: string
              - name: subtitulo
                label: Descripcion
                type: text
              - name: boton
                label: Boton
                type: object
                fields:
                  - name: titulo
                    label: Texto del boton
                    type: string
                  - name: link
                    label: Enlace del boton
                    type: string
              - name: carta1
                label: Tarjeta 1
                type: object
                fields:
                  - name: icono
                    label: Icono
                    type: string
                  - name: descripcion
                    label: Descripcion
                    type: text
                  - name: estilo
                    label: Estilos de la tarjeta
                    type: string
              - name: carta2
                label: Tarjeta 2
                type: object
                fields:
                  - name: icono
                    label: Icono
                    type: string
                  - name: descripcion
                    label: Descripcion
                    type: text
                  - name: estilo
                    label: Estilos de la tarjeta
                    type: string
              - name: carta3
                label: Tarjeta 3
                type: object
                fields:
                  - name: icono
                    label: Icono
                    type: string
                  - name: descripcion
                    label: Descripcion
                    type: text
                  - name: estilo
                    label: Estilos de la tarjeta
                    type: string
          - name: Caracteristicas_red
            label: Seccion de ventajas o razones
            type: object
            fields:
              - name: titulo
                label: Titulo
                type: text
              - name: subtitulo
                label: Descripcion
                type: text
              - name: lista
                label: Tarjetas
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{titulo_tarjeta}"
                fields:
                  - name: estilo_borde
                    label: Estilos de bordes
                    type: string
                  - name: gridClasses
                    label: Estilos de posicion
                    type: string
                  - name: estilo_color
                    label: Estilos de color
                    type: string
                  - name: icono
                    label: Icono
                    type: string
                  - name: titulo_tarjeta
                    label: Titulo de la tarjeta
                    type: string
                  - name: descripcion
                    label: Descripcion
                    type: text

  - name: editorial_content
    label: Contenido editorial
    type: group
    items:
      - name: articles
        label: Articulos
        type: collection
        path: src/content/articles
        filename:
          template: "{primary}.mdoc"
          field: create
        format: yaml-frontmatter
        view:
          fields: [title, date, description]
          primary: title
          sort: [date, title]
          search: [title, description, body]
          default:
            sort: date
            order: desc
        fields:
          - name: title
            label: Titulo
            type: string
          - name: description
            label: Descripcion corta
            type: text
          - name: date
            label: Fecha de publicacion
            type: date
          - name: body
            label: Contenido
            type: rich-text
            options:
              format: markdown
              media: uploads

      - name: reference_docs
        label: Documentacion de referencia
        type: collection
        path: src/content/reference
        filename:
          template: "{primary}.mdoc"
          field: create
        format: yaml-frontmatter
        view:
          fields: [title, date, description]
          primary: title
          sort: [date, title]
          search: [title, description, body]
          default:
            sort: date
            order: desc
        fields:
          - name: title
            label: Titulo
            type: string
          - name: description
            label: Descripcion corta
            type: text
          - name: date
            label: Fecha de publicacion
            type: date
          - name: body
            label: Contenido
            type: rich-text
            options:
              format: markdown
              media: uploads

  - name: data_library
    label: Biblioteca de recursos
    type: group
    items:
      - name: whitepapers
        label: Whitepapers
        type: collection
        path: src/data/whitepapers
        filename:
          template: "{primary}.json"
          field: create
        format: json
        view:
          fields: [title, readLink]
          primary: title
          sort: [title]
          search: [title, description, readLink]
          default:
            sort: title
            order: asc
        fields:
          - name: title
            label: Titulo
            type: string
          - name: description
            label: Descripcion
            type: text
          - name: readLink
            label: Enlace para leer
            type: string

      - name: spreadsheets
        label: Hojas de calculo
        type: collection
        path: src/data/spreadsheets
        filename:
          template: "{primary}.json"
          field: create
        format: json
        view:
          fields: [title, url]
          primary: title
          sort: [title]
          search: [title, description, url]
          default:
            sort: title
            order: asc
        fields:
          - name: title
            label: Titulo
            type: string
          - name: description
            label: Descripcion
            type: text
          - name: url
            label: Enlace de descarga
            type: string
