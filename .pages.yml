media:
  - name: uploads
    label: Archivos subidos
    input: public/uploads
    output: /CMS-WEB/uploads
    categories: [image, video]
    rename: safe

content:
  - name: site_pages
    label: Paginas del sitio
    type: group
    items:
      - name: home_page
        label: Pagina de inicio
        type: file
        path: src/content/pages/home.json
        format: json
        fields:
          - name: anuncio
            label: Franja superior
            type: object
            fields:
              - name: titulo
                label: Texto principal
                type: string
              - name: titulo_link
                label: Texto del boton
                type: string
              - name: link
                label: Enlace al hacer clic
                type: string
          - name: hero
            label: Portada principal
            type: object
            fields:
              - name: titulo
                label: Titulo principal
                type: string
              - name: subtitulo
                label: Texto de apoyo
                type: text
              - name: Boton_1
                label: Primer boton
                type: object
                fields:
                  - name: titulo
                    label: Texto del boton
                    type: string
              - name: boton_2
                label: Segundo boton
                type: object
                fields:
                  - name: titulo
                    label: Texto del boton
                    type: string
          - name: imagen
            label: Video e imagen principal
            type: object
            fields:
              - name: video
                label: Video principal
                type: string
              - name: ImagenArchivo
                label: Imagen principal subida
                type: image
                options:
                  media: uploads
              - name: Imagen
                label: Imagen externa opcional
                type: string
          - name: features
            label: Bloque destacado
            type: object
            fields:
              - name: titulo
                label: Titulo del bloque
                type: text
              - name: subtitulo
                label: Descripcion del bloque
                type: text
              - name: lista
                label: Tarjetas destacadas
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{title} ({index})'
                fields:
                  - name: title
                    label: Titulo de la tarjeta
                    type: string
                  - name: description
                    label: Texto descriptivo
                    type: text
                  - name: imagen
                    label: Ruta antigua de imagen
                    type: string
                  - name: image
                    label: Imagen principal
                    type: string
                  - name: listItems
                    label: Lista de puntos destacados
                    type: string
                    list: true
                  - name: component
                    label: Componente visual especial
                    type: string
                  - name: class
                    label: Ajuste interno de diseno (no cambiar)
                    type: text
                  - name: wrapperClass
                    label: Ajuste interno del contenedor (no cambiar)
                    type: text
                  - name: posicion
                    label: Ajuste antiguo de posicion
                    type: text
                  - name: imageClass
                    label: Ajuste interno de imagen (no cambiar)
                    type: text
                  - name: imageContainerClass
                    label: Ajuste interno del bloque de imagen (no cambiar)
                    type: text
                  - name: imageSecondaryContainerClass
                    label: Ajuste interno secundario (no cambiar)
                    type: text
                  - name: imageFadeClass
                    label: Ajuste interno de degradado (no cambiar)
                    type: text
                  - name: headingClass
                    label: Ajuste interno del titulo (no cambiar)
                    type: text
              - name: Orbita
                label: Iconos de la orbita
                type: object
                fields:
                  - name: Imagen_central
                    label: Imagen del centro
                    type: image
                    options:
                      media: uploads
                  - name: Icono_1
                    label: Icono 1
                    type: string
                  - name: Icono_2
                    label: Icono 2
                    type: string
                  - name: Icono_3
                    label: Icono 3
                    type: string
          - name: caracteristicas
            label: Bloque de ventajas
            type: object
            fields:
              - name: titulo
                label: Titulo del bloque
                type: string
              - name: subtitulo
                label: Descripcion del bloque
                type: text
              - name: boton
                label: Boton del bloque
                type: object
                fields:
                  - name: titulo
                    label: Texto del boton
                    type: string
                  - name: link
                    label: Enlace al hacer clic
                    type: string
              - name: carta1
                label: Tarjeta 1
                type: object
                fields:
                  - name: icono
                    label: Nombre del icono
                    type: string
                  - name: descripcion
                    label: Descripcion de la tarjeta
                    type: text
                  - name: estilo
                    label: Ajuste interno de diseno (no cambiar)
                    type: string
              - name: carta2
                label: Tarjeta 2
                type: object
                fields:
                  - name: icono
                    label: Nombre del icono
                    type: string
                  - name: descripcion
                    label: Descripcion de la tarjeta
                    type: text
                  - name: estilo
                    label: Ajuste interno de diseno (no cambiar)
                    type: string
              - name: carta3
                label: Tarjeta 3
                type: object
                fields:
                  - name: icono
                    label: Nombre del icono
                    type: string
                  - name: descripcion
                    label: Descripcion de la tarjeta
                    type: text
                  - name: estilo
                    label: Ajuste interno de diseno (no cambiar)
                    type: string
          - name: Caracteristicas_red
            label: Razones para elegirnos
            type: object
            fields:
              - name: titulo
                label: Titulo del bloque
                type: text
              - name: subtitulo
                label: Descripcion del bloque
                type: text
              - name: lista
                label: Tarjetas de beneficios
