media:
  - name: uploads
    label: Imagenes subidas
    input: public/uploads
    output: /CMS-WEB/uploads
    categories: [image]
    rename: safe

content:
  - name: site_pages
    label: Paginas del sitio
    type: group
    items:
      - name: home_page
        label: Pagina de inicio
        type: file
        path: src/content/pages/home.json
        format: json
        fields:
          - name: anuncio
            label: Franja superior
            type: object
            fields:
              - name: titulo
                label: Texto principal
                type: string
              - name: titulo_link
                label: Texto del boton
                type: string
              - name: link
                label: Enlace del boton
                type: string
          - name: hero
            label: Portada principal
            type: object
            fields:
              - name: titulo
                label: Titulo principal
                type: string
              - name: subtitulo
                label: Texto de apoyo
                type: text
              - name: Boton_1
                label: Primer boton
                type: object
                fields:
                  - name: titulo
                    label: Texto del boton
                    type: string
                  - name: link
                    label: Enlace del boton
                    type: string
              - name: boton_2
                label: Segundo boton
                type: object
                fields:
                  - name: titulo
                    label: Texto del boton
                    type: string
                  - name: link
                    label: Enlace del boton
                    type: string
          - name: imagen
            label: Video e imagen principal
            type: object
            fields:
              - name: video
                label: Archivo o enlace del video
                type: string
              - name: ImagenArchivo
                label: Imagen principal subida
                type: image
                options:
                  media: uploads
              - name: Imagen
                label: Imagen externa
                type: string
          - name: features
            label: Bloque destacado
            type: object
            fields:
              - name: titulo
                label: Titulo del bloque
                type: text
              - name: subtitulo
                label: Descripcion del bloque
                type: text
              - name: lista
                label: Tarjetas destacadas
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{title} ({index})"
                fields:
                  - name: title
                    label: Titulo de la tarjeta
                    type: string
                  - name: description
                    label: Descripcion
                    type: text
                  - name: imagen
                    label: Campo antiguo de imagen
                    type: string
                  - name: image
                    label: Imagen o ruta principal
                    type: string
                  - name: listItems
                    label: Lista de puntos
                    type: string
                    list: true
                  - name: component
                    label: Componente especial
                    type: string
                  - name: class
                    label: Ajuste interno de diseno (no cambiar)
                    type: text
                  - name: wrapperClass
                    label: Ajuste interno del contenedor (no cambiar)
                    type: text
                  - name: posicion
                    label: Campo antiguo de posicion
                    type: text
                  - name: imageClass
                    label: Ajuste interno de imagen (no cambiar)
                    type: text
                  - name: imageContainerClass
                    label: Ajuste interno del bloque de imagen (no cambiar)
                    type: text
                  - name: imageSecondaryContainerClass
                    label: Ajuste interno secundario (no cambiar)
                    type: text
                  - name: imageFadeClass
                    label: Ajuste interno de degradado (no cambiar)
                    type: text
                  - name: headingClass
                    label: Ajuste interno del titulo (no cambiar)
                    type: text
              - name: Orbita
                label: Iconos de la orbita
                type: object
                fields:
                  - name: Imagen_central
                    label: Imagen central
                    type: image
                    options:
                      media: uploads
                  - name: Icono_1
                    label: Icono 1
                    type: string
                  - name: Icono_2
                    label: Icono 2
                    type: string
                  - name: Icono_3
                    label: Icono 3
                    type: string
          - name: caracteristicas
            label: Bloque de ventajas
            type: object
            fields:
              - name: titulo
                label: Titulo del bloque
                type: string
              - name: subtitulo
                label: Descripcion del bloque
                type: text
              - name: boton
                label: Boton del bloque
                type: object
                fields:
                  - name: titulo
                    label: Texto del boton
                    type: string
                  - name: link
                    label: Enlace del boton
                    type: string
              - name: carta1
                label: Tarjeta 1
                type: object
                fields:
                  - name: icono
                    label: Nombre del icono
                    type: string
                  - name: descripcion
                    label: Texto de la tarjeta
                    type: text
                  - name: estilo
                    label: Ajuste interno de diseno (no cambiar)
                    type: string
              - name: carta2
                label: Tarjeta 2
                type: object
                fields:
                  - name: icono
                    label: Nombre del icono
                    type: string
                  - name: descripcion
                    label: Texto de la tarjeta
                    type: text
                  - name: estilo
                    label: Ajuste interno de diseno (no cambiar)
                    type: string
              - name: carta3
                label: Tarjeta 3
                type: object
                fields:
                  - name: icono
                    label: Nombre del icono
                    type: string
                  - name: descripcion
                    label: Texto de la tarjeta
                    type: text
                  - name: estilo
                    label: Ajuste interno de diseno (no cambiar)
                    type: string
          - name: Caracteristicas_red
            label: Razones para elegirnos
            type: object
            fields:
              - name: titulo
                label: Titulo del bloque
                type: text
              - name: subtitulo
                label: Descripcion del bloque
                type: text
              - name: lista
                label: Tarjetas
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{titulo_tarjeta}"
                fields:
                  - name: estilo_borde
                    label: Ajuste interno de bordes (no cambiar)
                    type: string
                  - name: gridClasses
                    label: Ajuste interno de posicion (no cambiar)
                    type: string
                  - name: estilo_color
                    label: Ajuste interno de color (no cambiar)
                    type: string
                  - name: icono
                    label: Nombre del icono
                    type: string
                  - name: titulo_tarjeta
                    label: Titulo de la tarjeta
                    type: string
                  - name: descripcion
                    label: Texto de la tarjeta
                    type: text
          - name: call_to_action
            label: Llamado final a la accion
            type: object
            fields:
              - name: titulo
                label: Titulo principal
                type: text
              - name: subtitulo
                label: Texto de apoyo
                type: text
              - name: boton
                label: Boton principal
                type: object
                fields:
                  - name: titulo
                    label: Texto del boton
                    type: string
                  - name: link
                    label: Enlace del boton
                    type: string
          - name: carrusel
            label: Catalogo de rosas
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{titulo}"
            fields:
              - name: titulo
                label: Nombre de la rosa
                type: string
              - name: descripcion
                label: Descripcion corta
                type: text
              - name: ImagenArchivo
                label: Imagen de la rosa
                type: image
                options:
                  media: uploads
              - name: tipo
                label: Categoria o tipo
                type: string
              - name: Data
                label: Datos tecnicos
                type: object
                fields:
                  - name: Tamaño_del_boton
                    label: Tamano del boton
                    type: string
                  - name: Longitud_del_tallo
                    label: Longitud del tallo
                    type: string
                  - name: Vida_en_florero
                    label: Vida en florero
                    type: string
                  - name: Numero_de_petalos
                    label: Numero de petalos
                    type: string
                  - name: Estado_fenologico
                    label: Estado fenologico
                    type: string
                  - name: Ciclo
                    label: Ciclo
                    type: string
                  - name: link
                    label: Enlace del producto
                    type: string
      - name: about_page
        label: Pagina Nosotros
        type: file
        path: src/content/pages/about.json
        format: json
        fields:
          - name: datos_sobre_nosotros
            label: Informacion principal
            type: object
            fields:
              - name: titulo
                label: Titulo
                type: string
              - name: descripcion
                label: Descripcion
                type: text
              - name: estadisticas
                label: Estadisticas
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{texto}"
                fields:
                  - name: texto
                    label: Texto
                    type: string
                  - name: valor
                    label: Valor
                    type: string
          - name: datos_de_experticie
            label: Experiencia del equipo
            type: object
            fields:
              - name: titulo
                label: Titulo
                type: string
              - name: experticie
                label: Lista de experiencia
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{titulo}"
                fields:
                  - name: titulo
                    label: Titulo
                    type: string
                  - name: descripcion
                    label: Descripcion
                    type: text
      - name: seo_pages
        label: SEO y metadatos
        type: file
        path: src/content/pages/SEO.json
        format: json
        fields:
          - name: sobre_nosotros
            label: SEO pagina nosotros
            type: object
            fields:
              - name: lenguaje
                label: Idioma
                type: string
              - name: nombre
                label: Nombre de la pagina
                type: string
              - name: descripcion
                label: Descripcion general
                type: text
              - name: parte_de
                label: Informacion del sitio
                type: object
                fields:
                  - name: nombre
                    label: Nombre del sitio
                    type: string
                  - name: descripcion
                    label: Descripcion del sitio
                    type: text
          - name: seo_sobre_nosotros
            label: Meta etiquetas de nosotros
            type: object
            fields:
              - name: title
                label: Titulo SEO
                type: string
              - name: description
                label: Descripcion SEO
                type: text
          - name: seo_contactos
            label: SEO pagina contacto
            type: object
            fields:
              - name: lenguaje
                label: Idioma
                type: string
              - name: nombre
                label: Nombre de la pagina
                type: string
              - name: description
                label: Descripcion general
                type: text
              - name: parte_de
                label: Informacion del sitio
                type: object
                fields:
                  - name: nombre
                    label: Nombre del sitio
                    type: string
                  - name: descripcion
                    label: Descripcion del sitio
                    type: text
          - name: seo_contact
            label: Meta etiquetas de contacto
            type: object
            fields:
              - name: title
                label: Titulo SEO
                type: string
              - name: description
                label: Descripcion SEO
                type: text
      - name: contact_page
        label: Pagina Contacto
        type: file
        path: src/content/pages/contactos.json
        format: json
        fields:
          - name: contactos
            label: Contenido de contacto
            type: object
            fields:
              - name: titulo
                label: Titulo principal
                type: string
              - name: subtitulo
                label: Texto introductorio
                type: text
              - name: direcciones
                label: Direccion
                type: object
                fields:
                  - name: titulo
                    label: Titulo de direccion
                    type: string
                  - name: direccion_1
                    label: Direccion linea 1
                    type: string
                  - name: direccion_2
                    label: Direccion linea 2
                    type: string
              - name: correo
                label: Correo y telefono
                type: object
                fields:
                  - name: titulo
                    label: Titulo de contacto
                    type: string
                  - name: telefono
                    label: Telefono
                    type: string
                  - name: mail
                    label: Correo electronico
                    type: string
              - name: blog
                label: Bloque de ayuda
                type: object
                fields:
                  - name: titulo
                    label: Titulo del bloque
                    type: string
                  - name: detalles
                    label: Detalles del bloque
                    type: object
                    fields:
                      - name: descripcion
                        label: Descripcion
                        type: text
                      - name: texto
                        label: Texto del enlace
                        type: string
                      - name: link
                        label: Enlace
                        type: string
      - name: footer_page
        label: Pie de pagina
        type: file
        path: src/content/pages/footer.json
        format: json
        fields:
          - name: generales
            label: Informacion general
            type: object
            fields:
              - name: nombre_empresa
                label: Nombre de la empresa
                type: string
              - name: Descripcion
                label: Descripcion de la empresa
                type: text
          - name: contactos
            label: Datos de contacto
            type: object
            fields:
              - name: address
                label: Direccion corta
                type: string
              - name: phone
                label: Telefono
                type: string
              - name: email
                label: Correo electronico
                type: string
              - name: website
                label: Sitio web
                type: string
          - name: creacion
            label: Creditos del creador
            type: object
            fields:
              - name: nombre
                label: Nombre
                type: string
              - name: Link
                label: Enlace
                type: string
          - name: noticia
            label: Aviso legal
            type: object
            fields:
              - name: titulo
                label: Texto del aviso
                type: text
          - name: footer_form
            label: Formulario del pie de pagina
            type: object
            fields:
              - name: leyenda
                label: Titulo del formulario
                type: string
              - name: placeholder
                label: Texto de ayuda del campo
                type: string
              - name: submit
                label: Texto del boton
                type: string
              - name: description
                label: Descripcion del formulario
                type: text
      - name: navbar_page
        label: Barra de navegacion
        type: file
        path: src/content/pages/navbar.json
        format: json
        fields:
          - name: barra_de_navegacion
            label: Contenido de la barra superior
            type: object
            fields:
              - name: logo
                label: Logo
                type: object
                fields:
                  - name: imagen
                    label: Imagen del logo
                    type: image
                    options:
                      media: uploads
                  - name: descripcion
                    label: Texto alternativo del logo
                    type: string
              - name: boton
                label: Boton principal
                type: object
                fields:
                  - name: texto
                    label: Texto del boton
                    type: string
                  - name: link
                    label: Enlace del boton
                    type: string

  - name: editorial_content
    label: Contenido editorial
    type: group
    items:
      - name: articles
        label: Articulos
        type: collection
        path: src/content/articles
        filename:
          template: "{primary}.mdoc"
          field: create
        format: yaml-frontmatter
        view:
          fields: [title, date, description]
          primary: title
          sort: [date, title]
          search: [title, description, body]
          default:
            sort: date
            order: desc
        fields:
          - name: title
            label: Titulo
            type: string
          - name: description
            label: Descripcion corta
            type: text
          - name: date
            label: Fecha de publicacion
            type: date
          - name: body
            label: Contenido
            type: rich-text
            options:
              format: markdown
              media: uploads

      - name: reference_docs
        label: Documentacion de referencia
        type: collection
        path: src/content/reference
        filename:
          template: "{primary}.mdoc"
          field: create
        format: yaml-frontmatter
        view:
          fields: [title, date, description]
          primary: title
          sort: [date, title]
          search: [title, description, body]
          default:
            sort: date
            order: desc
        fields:
          - name: title
            label: Titulo
            type: string
          - name: description
            label: Descripcion corta
            type: text
          - name: date
            label: Fecha de publicacion
            type: date
          - name: body
            label: Contenido
            type: rich-text
            options:
              format: markdown
              media: uploads

  - name: data_library
    label: Biblioteca de recursos
    type: group
    items:
      - name: whitepapers
        label: Whitepapers
        type: collection
        path: src/data/whitepapers
        filename:
          template: "{primary}.json"
          field: create
        format: json
        view:
          fields: [title, readLink]
          primary: title
          sort: [title]
          search: [title, description, readLink]
          default:
            sort: title
            order: asc
        fields:
          - name: title
            label: Titulo
            type: string
          - name: description
            label: Descripcion
            type: text
          - name: readLink
            label: Enlace para leer
            type: string

      - name: spreadsheets
        label: Hojas de calculo
        type: collection
        path: src/data/spreadsheets
        filename:
          template: "{primary}.json"
          field: create
        format: json
        view:
          fields: [title, url]
          primary: title
          sort: [title]
          search: [title, description, url]
          default:
            sort: title
            order: asc
        fields:
          - name: title
            label: Titulo
            type: string
          - name: description
            label: Descripcion
            type: text
          - name: url
            label: Enlace de descarga
            type: string
